<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CDN@JIE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --bg: #f5f5f7; 
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3; /* 经典的苹果蓝 */
            --accent-hover: #0077ed;
            --border-radius: 20px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            max-width: 720px;
            margin: 60px auto;
            padding: 0 24px;
            flex: 1;
        }


        .hero {
            text-align: center;
            margin-bottom: 60px;
            padding-top: 40px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
        }


        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 20px;
        }


        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 12px 24px;
            border-radius: 980px; 
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        /* 列表样式：简洁的圆点 */
        ul {
            list-style: none;
            margin-top: 10px;
        }

        li {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 12px;
            padding-left: 20px;
            position: relative;
        }

        li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10px;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
        }

        .link-text {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .link-text:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.8rem;
            color: #b0b0b5;
            margin-top: auto;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            main {
                margin: 30px auto;
            }

            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1.1rem;
                padding: 0 10px;
            }

            .card {
                padding: 30px 24px;
            }


            div[style*="grid-template-columns"] {
                grid-template-columns: 1fr !important;
                gap: 20px !important; 
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<main>
    <!-- 顶部居中 Hero 区域 -->
    <div class="hero">
        <h1>CDN@<a href="/sites/" target="_blank" style="text-decoration: none; color: #1296db;">JIE</a></h1>
        <p class="subtitle">
            GitHub 存储 + EdgeOne Makers 分发<br>
            兼顾 PicX 的极简静态资源图床
        </p>
    </div>

    <!-- 介绍卡片 -->
    <div class="card">
        <h2>关于这个项目</h2>
        <p>
            CDN 分发静态资源，GitHub 储存 + EdgeOne Makers 配置。仓库是个大杂烩，兼顾 PicX：一个基于 GitHub 的图床工具；也放了一些静态网页进去，方便管理
        </p>
        <p>
            写博客、记笔记、整理文档时，图片总是件麻烦事。本地图片换台设备就丢了，第三方图床又总担心哪天跑路。PicX 就是把这件事变得简单、稳定、可控
        </p>
        <a href="https://picx.xpoet.cn/" target="_blank" class="btn">
            打开 PicX 图床
        </a>
    </div>
    <div style="text-align: center; margin-top: 40px;">
        <p style="font-size: 0.9rem;">
            PicX 项目开源，可在 <a href="https://github.com/youngdajie/picx-images-hosting" target="_blank" class="link-text">GitHub</a> 查看
        </p>
    </div>
</main>

<footer>
    © 2026 JIE
</footer>

</body>
</html>
