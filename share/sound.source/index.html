<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件列表</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            background: #111;
            color: #eee;
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        }

        .container {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .desc {
            margin-bottom: 24px;
            color: #888;
            font-size: 14px;
        }

        .tree {
            padding: 20px 24px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #1a1a1a;
        }

        .root {
            margin-bottom: 12px;
            color: #ffd666;
            font-weight: 600;
        }

        .file-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .file {
            margin: 6px 0;
        }

        .file a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #ddd;
            text-decoration: none;
            transition: background .15s, color .15s;
        }

        .file a:hover {
            background: #292929;
            color: #fff;
        }

        .icon {
            width: 24px;
            text-align: center;
        }

        .name {
            flex: 1;
        }

        .type {
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>📁 文件列表</h1>
        <div class="desc">点击文件即可在新窗口打开</div>

        <section class="tree">
            <div class="root">📂 当前文件夹</div>

            <ul class="file-list">
                <li class="file">
                    <a href="./ikun-music-source.js" target="_blank" rel="noopener noreferrer">
                        <span class="icon">🟨</span>
                        <span class="name">ikun-music-source.js</span>
                        <span class="type">JavaScript</span>
                    </a>
                </li>

                <!-- <li class="file">
                    <a href="./index.html" target="_blank" rel="noopener noreferrer">
                        <span class="icon">🌐</span>
                        <span class="name">index.html</span>
                        <span class="type">HTML</span>
                    </a>
                </li> -->
            </ul>
        </section>
    </main>
</body>
</html>
