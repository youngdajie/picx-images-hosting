  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方块数字时钟 - 桌面时钟</title>
  <meta name="keywords" content="时钟,桌面时钟,桌面时钟,时钟图片,数字时钟,在线时钟,时钟屏保,时钟软件,全屏时钟">
  <meta name="description" content="网格背景时钟，浮动绿色方块数字显示时钟，可以全屏显示的电脑时钟屏保。">
  <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    background: radial-gradient(circle at center, transparent, #000 95%), 
                linear-gradient(#444 2px, transparent 0) 0 0/20px 20px, 
                linear-gradient(90deg, #444 2px, #000 0) 0 0/20px 20px;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  
  .container, .surface, .block, .block-outer, .block-inner {
    transform-style: preserve-3d;
  }
  
  .container, .block, .digit {
    position: absolute;
  }
  
  .container {
    animation: bounce 2s cubic-bezier(0.4, 0.1, 0.6, 0.9) infinite;
    display: flex;
    margin: auto;
    overflow: hidden;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 594px;
    height: 200px;
    perspective: 800px;
  }
  
  .surface {
    animation: tilt 2s -1.5s cubic-bezier(0.4, 0.1, 0.6, 0.9) infinite;
    display: block;
    width: 540px;
    height: 20px;
    margin: auto;
    transform: translateY(50px) rotateX(105deg) rotateZ(0deg);
    will-change: transform;
  }
  
  .block {
    bottom: 0;
  }
  
  .block-inner div {
    background-color: #74d447;
  }
  .block-inner > div {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    position: absolute;
    width: 20px;
    height: 20px;
  }
  .block-inner > div.top:before, .block-inner > div.bottom:before, .block-inner > div.left:before, .block-inner > div.right:before {
    background-color: #000;
    content: "";
    width: 100%;
    height: 100%;
  }
  .block-inner > div.top:before, .block-inner > div.bottom:before {
    opacity: 0.2;
  }
  .block-inner > div.left:before, .block-inner > div.right:before {
    opacity: 0.4;
  }
  
  .block-outer, .block-inner {
    position: relative;
    width: 20px;
  }
  
  .block-outer {
    transition: transform 0.3s;
  }
  
  .block-inner {
    transform: rotateX(-90deg) translateZ(20px);
  }
  
  .back {
    transform: translateZ(-20px) rotateY(180deg);
  }
  
  .left {
    transform-origin: center left;
    transform: rotateY(270deg) translateX(-20px);
  }
  
  .right {
    transform-origin: top right;
  }
  
  .top, .bottom {
    transform-origin: top center;
  }

      <script>
        document.write([...Array(94)].map((_, i) => `
          <div class="block b${i+1}">
            <div class="block-outer">
              <div class="block-inner">
                <div class="bottom"></div>
                <div class="front"></div>

        `).join(''));
      </script>

  <script>
  window.addEventListener("load", update);
  
  function update() {
    let time = new Date();
    let hr = String(time.getHours()).padStart(2, '0');
    let min = String(time.getMinutes()).padStart(2, '0');
    let sec = String(time.getSeconds()).padStart(2, '0');
    let timeStr = hr + min + sec;
    
    document.querySelectorAll('.digit').forEach((digit, i) => {
      digit.className = `digit _${timeStr[i]}`;
    });
    
    setTimeout(update, 1000);
  }    
  </script>
